name: 构建 · ImmortalWrt 23.05 · 360 T7
run-name: 构建 · ImmortalWrt 23.05 · 360 T7 · ${{ github.ref_name }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-immortalwrt-23_05-360t7]

permissions:
  contents: read

# 同一目标限制并发，不取消正在运行的编译；不同目标可并行。
concurrency:
  group: build-immortalwrt-23_05-360t7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ImmortalWrt 23.05 · 360 T7
    uses: ./.github/workflows/build-common.yml
    with:
      target: immortalwrt-23_05-360t7
