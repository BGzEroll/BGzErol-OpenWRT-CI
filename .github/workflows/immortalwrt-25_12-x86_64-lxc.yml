name: 构建 · ImmortalWrt 25.12 · x86_64 LXC
run-name: 构建 · ImmortalWrt 25.12 · x86_64 LXC · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

# 同一目标限制并发，不取消正在运行的编译；不同目标可并行。
concurrency:
  group: build-immortalwrt-25_12-x86_64-lxc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ImmortalWrt 25.12 · x86_64 LXC
    uses: ./.github/workflows/build-common.yml
    with:
      target: immortalwrt-25_12-x86_64-lxc
